{{ block styles }}
    <link rel="stylesheet" href="{{ static 'climate_questionnaire/climate_questionnaire.css' }}">
{{ endblock }}

{{ block title }}
<div class="text-center mb-4">
    Limba / Язык
</div>
{{ endblock }}

{{ block content }}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

        <div class="card experiment-card mb-4">
            <div class="card-body p-4 text-center">
                <p>Vă rugăm să alegeți limba chestionarului.</p>
                <p>Пожалуйста, выберите язык анкеты.</p>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-primary btn-lg" name="language" value="ro">Română</button>
            <button class="btn btn-primary btn-lg" name="language" value="ru">Русский</button>
        </div>

    </div>
</div>
{{ endblock }}

{{ block scripts }}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (js_vars.fill_auto) {
            setTimeout(function () {
                const buttons = document.querySelectorAll('button[name="language"]');
                buttons[Math.floor(Math.random() * buttons.length)].click();
            }, 2000);
        }
    });
</script>
{{ endblock }}
